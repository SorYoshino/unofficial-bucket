# Configuration for Dependabot version updates
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"

    # Schedule: Run at 15:27 every Sunday (UTC)
    schedule:
      interval: "cron"
      cronjob: "27 15 * * 0"

    # Cooldown: Wait 3 days after a new version is released to ensure stability
    cooldown:
      default-days: 3

    # Commit message format: e.g., "(chore): Bump actions/checkout..."
    commit-message:
      prefix: "(chore)"

    # Labels: Used for filtering and managing automated PRs in GitHub
    labels:
      - "dependencies"
      - "dependabot-automated"

    # Grouping strategy: Consolidate updates to reduce PR noise
    groups:
      # 1. Security updates: Immediate priority to fix vulnerabilities
      security-patches:
        applies-to: "security-updates"
        patterns:
          - "*"

      # 2. Version updates: Bundle minor and patch releases together
      non-breaking-updates:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
