name: Dependabot Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

# Explicitly grant elevation required to approve and merge PRs
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-Merge Eligible Updates
    runs-on: ubuntu-latest
    # Ensure the PR actor is strictly the Dependabot bot
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.DEPENDABOT_PAT }} # Requires a PAT to query security advisories
          compat-lookup: true # Fetches the ecosystem compatibility score from GitHub big data
          alert-lookup: true # Checks if this dependency has known security vulnerabilities

      - name: Check Merge Eligibility
        id: check
        run: |
          TYPE="${{ steps.metadata.outputs.update-type }}"
          ALERT="${{ steps.metadata.outputs.alert-state }}"
          TARGET="${{ steps.metadata.outputs.target-branch }}"
          SCORE="${{ steps.metadata.outputs.compatibility-score }}"

          reasons=()
          : "${ALERT:=NONE}" "${SCORE:=0}"

          [ "$TARGET" != "master" ] && reasons+=("Target branch is '$TARGET' (expected 'master')")
          [ "$TARGET" = "master" ] && [ "$ALERT" != "OPEN" ] && {
              [ "$TYPE" = "version-update:semver-major" ] && reasons+=("SemVer Major updates require manual review ($TYPE)")
              [ "$SCORE" -lt 80 ] && reasons+=("Compatibility score is too low ($SCORE < 80)")
          }

          if [ ${#reasons[@]} -eq 0 ]; then
              echo "[RESULT] Decision: ELIGIBLE - Meets auto-merge criteria!"
              echo "eligible=true" >> $GITHUB_OUTPUT
          else
              echo "[RESULT] Decision: BLOCKED - Pending manual review."
              printf "[REASON] %s\n" "${reasons[@]}"
              echo "eligible=false" >> $GITHUB_OUTPUT
          fi

      - name: Approve and Enable Auto-Merge
        if: steps.check.outputs.eligible == 'true'
        run: |
          if [ "$(gh pr view "$PR_URL" --json reviewDecision -q .reviewDecision)" != "APPROVED" ]; then
              gh pr review --approve "$PR_URL"
          else
              echo "PR already approved, skipping duplicate approval."
          fi
          # '--squash' combines all commits in the PR into a single commit on master.
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
