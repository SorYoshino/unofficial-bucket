name: Excavator

on:
  workflow_dispatch:
  schedule:
    # Runs at 37 minutes past the hour, every 3 hours
    - cron: '37 */3 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          SCOOP_REPO: https://github.com/SorYoshino/Scoop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BRANCH: unofficial
          SKIP_UPDATED: 1
