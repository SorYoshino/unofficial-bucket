name: Excavator

on:
  workflow_dispatch:
  schedule:
    # Runs at 37 minutes past the hour, every 3 hours
    - cron: '37 */3 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          SCOOP_REPO: https://github.com/SorYoshino/Scoop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BRANCH: unofficial
          SKIP_UPDATED: 1
